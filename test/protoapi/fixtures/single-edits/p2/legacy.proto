syntax = "proto2";

package shop.legacy;

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  optional string table = 60001;
}

// An order.
message Order {
  required int64 id = 1;
  optional string note = 2 [default = "none"];
  optional int32 qty = 3 [default = 1];
  optional int64 big = 4 [default = 9007199254740993];
  optional Color color = 5 [default = GREEN];
  repeated int32 codes = 7 [packed = true];
  repeated int32 raw = 8;
  // Shipping block.
  optional group Shipping = 9 {
    optional string address = 1;
  }
  optional bytes token = 10 [default = "\001\002"];
  optional double ratio = 11 [default = inf];
  optional float f = 12 [default = 1.5];
  optional string ct = 13 [ctype = CORD];
  optional Color color2 = 14;
  extensions 100 to 199;
  extensions 1000 to max;
  extensions 500 to 599 [verification = UNVERIFIED];
  reserved 20 to 25;
}

extend Order {
  optional bool priority = 100;
}

message Holder {
  extend Order {
    optional string tagged = 101;
  }
}

enum Color {
  RED = 1;
  GREEN = 2;
  BLUE = 3;
}

enum Alias {
  option allow_alias = true;
  A = 0;
  B = 1;
  C = 1;
}
